<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TubePilot AI Copilot</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #0f0f13;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #e11d48, #ec4899);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }
    .pill {
      font-size: 9px;
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .status-live {
      color: #34d399;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #18181f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 11px;
      outline: none;
    }
    .input-field:focus {
      border-color: #f43f5e;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="badge">TP</div>
      <div class="title">TubePilot <span class="pill">AI</span></div>
    </div>
    <span class="status-live"><span class="dot"></span> Online</span>
  </div>

  <div class="status-row">
    <span style="color:#94a3b8;">Web Workspace</span>
    <span style="color:#38bdf8; font-weight:700;">localhost:3001</span>
  </div>

  <div class="input-group">
    <label class="input-label" for="channel-input">Audit Any YouTube Channel:</label>
    <input type="text" id="channel-input" class="input-field" placeholder="Enter @handle (e.g. @MrBeast)" />
  </div>

  <button id="btn-audit" class="btn">🚀 Quick Audit Channel</button>
  <a href="http://localhost:3001/uz/dashboard" target="_blank" class="btn btn-secondary">🌐 Open TubePilot Studio</a>

  <script src="popup.js"></script>
</body>
</html>
